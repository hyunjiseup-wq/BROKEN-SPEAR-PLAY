  <body>
    <canvas id="c"></canvas>

    <!-- 좌상단 · 작전 진행과 경보 -->
    <div class="hud hud-tl">
      <div class="row sub">
        <span id="sub-id" class="subid">1-1</span>
        <span id="sub-name" class="subname">AFTERMATH</span>
        <span id="timer" class="mono dim">0:00</span>
      </div>
      <div id="sub-dots" class="sub-dots"></div>
      <div id="objective" class="objective">Leave the crash site</div>
      <div id="goals" class="goals"></div>
      <div class="row alert">
        <span class="label">ALERT</span>
        <span id="alert-pips" class="pips">▯▯▯▯</span>
        <span id="alert-name" class="value">0 · 정숙</span>
      </div>
      <div class="bar slim"><i id="alert-fill" class="fill"></i></div>
    </div>

    <!-- Substage 전환 배너 -->
    <div class="banner" id="banner">
      <div id="banner-cleared" class="banner-cleared"></div>
      <div id="banner-id" class="banner-id">1-2</div>
      <div id="banner-name" class="banner-name">TREELINE</div>
      <div id="banner-sub" class="banner-sub">임도 · 벌목 야적장 · 안개</div>
    </div>

    <!-- 우상단 · P0 계측 -->
    <div class="hud hud-tr" id="crit"></div>

    <!-- 좌하단 · 상태 -->
    <div class="hud hud-bl">
      <div class="row cond">
        <span id="cond-name" class="cond-name">HEALTHY</span>
        <span id="cond-note" class="mono dim">HEALTHY</span>
      </div>
      <div class="row sustainment" id="sustainment-row">
        <span class="label">FIELD STATUS</span>
        <span id="sustainment-status" class="mono">MOBILITY 100% · FRESH · LIGHT · HYDRATION NOMINAL</span>
      </div>
      <div class="row squad-command" id="squad-command-row">
        <span class="label">RAVEN-3</span>
        <span id="squad-command-status" class="mono">FOLLOW</span>
      </div>
      <div class="stat">
        <span class="label">HEALTH</span>
        <div class="bar"><i id="hp-fill" class="fill hp"></i></div>
        <span id="hp-text" class="mono">100</span>
      </div>
      <div id="injuries" class="injuries"></div>
      <div class="stat">
        <span class="label">PROTECTION</span>
        <div class="bar"><i id="armor-fill" class="fill armor"></i></div>
        <span id="armor-text" class="mono">0</span>
      </div>
      <div class="stat" id="supp-row">
        <span class="label supp">SUPPRESSION</span>
        <div class="bar"><i id="supp-fill" class="fill supp"></i></div>
        <span class="mono dim">PINNED</span>
      </div>
      <div id="reload" class="reload">
        <div class="bar"><i id="reload-fill" class="fill"></i></div>
        <span id="reload-label" class="mono">RELOAD</span>
      </div>
    </div>

    <!-- 우하단 · 무기와 탄창 -->
    <div class="hud hud-br">
      <div class="wep">
        <span id="weapon-name" class="wname">K-5 권총</span>
        <span id="weapon-cal" class="wcal">9mm</span>
      </div>
      <div id="mag-main" class="mag-main">17 / 17</div>
      <div id="mag-pips" class="mag-pips"></div>
      <div id="mag-total" class="mono dim">34 ROUNDS</div>
      <div id="knife-cue" class="knife-cue"></div>
    </div>

    <!-- 무전 로그 -->
    <div class="hud log" id="log"></div>

    <!-- 관통표 -->
    <div class="hud legend hidden" id="legend"></div>

    <div class="overlay on" id="overlay">
      <div class="overlay-inner" id="overlay-inner"></div>
    </div>

  </body>
</html>
